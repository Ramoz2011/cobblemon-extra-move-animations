# The NeoForge build of the mod. The mod's version, Minecraft and Cobblemon versions are read from
# ../gradle.properties (the Fabric build's), so there is one place to bump them.
org.gradle.jvmargs=-Xmx2G

# check these on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.1.248
neoforge_version_range=[21.1,)
# Cobblemon needs Kotlin for Forge at runtime
kotlinforforge_version=5.9.0
