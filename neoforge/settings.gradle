pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

// Lets Gradle auto-download a JDK 21 toolchain (Cobblemon requires exactly Java 21 at runtime)
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Cobblemon_extra_move_animation-neoforge'
